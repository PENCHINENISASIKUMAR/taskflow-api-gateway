spring.config.import=optional:file:../.taskflow-dev-secrets.properties,optional:file:.taskflow-dev-secrets.properties
spring.application.name=api-gateway
server.port=8080
server.address=127.0.0.1
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[2].id=task-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://task-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/tasks/**
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Content-Type,Accept,Authorization,X-Requested-With,X-XSRF-TOKEN
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
taskflow.jwt.secret-base64=${JWT_SECRET_BASE64:}
management.endpoints.web.exposure.include=health,info
logging.level.com.taskflow=INFO
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/docs/user/v3/api-docs
springdoc.swagger-ui.urls[1].name=Task Service
springdoc.swagger-ui.urls[1].url=/docs/task/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.cloud.gateway.server.webflux.routes[3].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/user/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/docs/user/(?<segment>.*), /$\{segment}
spring.cloud.gateway.server.webflux.routes[4].id=task-service-docs
spring.cloud.gateway.server.webflux.routes[4].uri=lb://task-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/task/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/docs/task/(?<segment>.*), /$\{segment}
